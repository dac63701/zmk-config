# SPDX-License-Identifier: MIT
description: nPM1300 host fuel gauge, low-voltage protection, and ZMK battery adapter

compatible: "zmk,npm1300-vbat"

include: sensor-device.yaml

properties:
  charger:
    type: phandle
    required: true
    description: nPM1300 charger sensor used to obtain battery and VBUS state

  pmic:
    type: phandle
    required: true
    description: Parent nPM1300 MFD used to request ship mode

  ext-power:
    type: phandle
    required: true
    description: External-power device controlling the nonessential RGB rail
