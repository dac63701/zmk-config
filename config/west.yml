manifest:
  remotes:
    - name: darknao
      url-base: https://github.com/darknao
    - name: nrfconnect
      url-base: https://github.com/nrfconnect
  projects:
    - name: zmk
      # darknao/zmk-perkey_ug, pinned after syntax and compatibility review.
      # Do not replace this hash with a branch name: layer-map behavior must be
      # reproducible across firmware builds.
      remote: darknao
      revision: 453d2d8536106c1b5ba2ae68d6a2267965c16935
      import: app/west.yml
    - name: nrfxlib
      remote: nrfconnect
      repo-path: sdk-nrfxlib
      path: nrfxlib
      # nRF Connect SDK 2.6 companion revision for the Zephyr 3.5 generation
      # used by the pinned ZMK fork and its SDK 0.16.9 build image.
      revision: v2.6.0
  self:
    path: config
