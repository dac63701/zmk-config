CONFIG_ZMK_KEYBOARD_NAME="60wkeyboard"
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y

# Per-key WS2812 lighting. Keep the normal starting level modest and enforce
# the same hard maximum for both effects and the Fn-layer legend.
CONFIG_ZMK_RGB_UNDERGLOW=y
# Required by the pinned per-key RGB fork. Without this flag the
# underglow-layer node is compiled but never receives layer updates.
CONFIG_EXPERIMENTAL_RGB_LAYER=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=15
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MIN=0
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=20
CONFIG_ZMK_RGB_UNDERGLOW_BRT_STEP=5
CONFIG_ZMK_RGB_UNDERGLOW_SPD_START=1
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=4

# Turn the LEDs off when the keyboard idles while retaining them on USB.
# EXT_POWER keeps the existing nPM1300-controlled LED rail integration active.
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=n
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y
